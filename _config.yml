# Configuração do Blog
title: Qorp Post
description: Um blog clean focado em leitura — artigos sobre desenvolvimento, IA e carreira em tecnologia
author: Peterson Alves
lang: pt-BR

# Configurações do GitHub Pages
baseurl: ""
url: "https://qorp.com.br"

# Configurações de build
markdown: kramdown
highlighter: rouge

# Exibir posts por página
paginate: 10

# Configurações de plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Suporte a imagens
# Coloque suas imagens em assets/images/
# E referencie assim: ![alt]({{ site.baseurl }}/assets/images/nome.jpg)

# Excluir arquivos
exclude:
  - README.md
  - .gitignore
  - _bmad
  - design-artifacts
  - docs
  - .agent
  - Gemfile
  - Gemfile.lock
  - GUIA_RAPIDO.md

# Markdown settings
kramdown:
  auto_ids: true
  input: GFM
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    default_lang: javascript
    span:
      line_numbers: false
    block:
      line_numbers: false
