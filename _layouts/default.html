<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="{{ '/assets/custom.css' | relative_url }}">

    {% feed_meta %}
    {% seo %}

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  </head>
  <body>
    {% include header.html %}

    <main id="main-content" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="wrapper">
        <p>© {{ site.time | date: "%Y" }} {{ site.author }} • Qorp Post</p>
        {% if site.feed %}
          <p style="margin-top: 0.5rem;"><a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a></p>
        {% endif %}
      </div>
    </footer>
  </body>
</html>
