<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/header.css' | relative_url }}">

  {% feed_meta %}
  {% seo %}
</head>
<body>
  {% include header.html %}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</span>
      <div class="footer-links">
        <a href="{{ '/' | relative_url }}">Blog</a>
        <a href="{{ '/servicos' | relative_url }}">Serviços</a>
        <a href="{{ '/sobre' | relative_url }}">Sobre</a>
      </div>
    </div>
  </footer>
</body>
</html>
