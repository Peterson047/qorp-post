<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  {% include taskbar.html %}

  <div class="desktop">
    {% include sidebar.html %}

    <div class="window" style="flex:1; min-width:0;">
      <div class="window-title">
        <span class="window-title-text">
          <span class="window-title-icon">📝</span>
          {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
        </span>
        <div class="window-controls">
          <button class="window-btn">_</button>
          <button class="window-btn">□</button>
          <button class="window-btn">×</button>
        </div>
      </div>
      <div class="window-menubar">
        <span class="menu-item">Arquivo</span>
        <span class="menu-item">Editar</span>
        <span class="menu-item">Exibir</span>
      </div>
      <div class="window-body">
        {{ content }}
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span class="statusbar-section">Pronto</span>
    <span class="statusbar-section">{{ site.time | date: "%d/%m/%Y %H:%M" }}</span>
  </div>
</body>
</html>
