<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="{{ '/assets/custom.css' | relative_url }}">

    {% feed_meta %}
    {% seo %}

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

    <!-- Skip Link for Accessibility -->
    <style>
      .skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        background: var(--gray-950);
        color: var(--white);
        padding: var(--spacing-sm) var(--spacing-md);
        z-index: 1000;
        text-decoration: none;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo</a>

    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <input type="checkbox" id="nav-trigger" class="nav-trigger" />
          <label for="nav-trigger">
            <span class="menu-icon">
              <svg viewBox="0 0 18 15" width="18px" height="15px">
                <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
              </svg>
            </span>
          </label>

          <div class="trigger">
            <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
            <a class="page-link" href="{{ "/sobre" | relative_url }}">Sobre</a>
            <a class="page-link" href="{{ "/arquivo" | relative_url }}">Arquivo</a>
          </div>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="wrapper">
        <p>© {{ site.time | date: "%Y" }} {{ site.author }} • Publicado com <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a></p>
        {% if site.feed %}
          <p style="margin-top: 0.5rem;"><a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a></p>
        {% endif %}
      </div>
    </footer>
  </body>
</html>
