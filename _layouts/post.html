---
layout: default
---

<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%d %b %Y" }}
      </time>
      {% if page.categories %}
        {% for cat in page.categories %}
          <span> • </span><span itemprop="articleSection">{{ cat }}</span>
        {% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>

  {% if page.tags %}
  <footer style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-300);">
    <p style="font-family: var(--font-sans); font-size: var(--text-xs); color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.05em;">
      Tags:
      {% for tag in page.tags %}
        <span style="display: inline-block; background: var(--gray-100); padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); margin-right: 0.5rem;">{{ tag }}</span>
      {% endfor %}
    </p>
  </footer>
  {% endif %}
</article>
