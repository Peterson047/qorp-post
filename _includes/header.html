<header class="site-header">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="site-title">Qorp</a>
    <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.site-nav').classList.toggle('open')">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">Blog</a>
      <a href="{{ '/servicos' | relative_url }}" class="nav-link{% if page.url == '/servicos/' %} active{% endif %}">Serviços</a>
      <a href="{{ '/produtos' | relative_url }}" class="nav-link{% if page.url == '/produtos/' %} active{% endif %}">Produtos</a>
      <a href="{{ '/sobre' | relative_url }}" class="nav-link{% if page.url == '/sobre/' %} active{% endif %}">Sobre</a>
    </nav>
  </div>
</header>
