<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo">Qorp</a>
    <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.site-nav').classList.toggle('open')">Menu</button>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">Blog</a>
      <a href="{{ '/servicos' | relative_url }}" class="nav-link{% if page.url == '/servicos/' %} active{% endif %}">Serviços</a>
      <a href="{{ '/produtos' | relative_url }}" class="nav-link{% if page.url == '/produtos/' %} active{% endif %}">Produtos</a>
      <a href="{{ '/sobre' | relative_url }}" class="nav-link{% if page.url == '/sobre/' %} active{% endif %}">Sobre</a>
    </nav>
  </div>
</header>
